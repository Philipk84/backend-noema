services:
  db:
    image: postgres:18
    container_name: ${POSTGRES_CONTAINER_NAME:-postgres-db-noema}
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data: